services:
  - type: web
    name: watchparty-server
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Optional: comma-separated allowlist, e.g.
      # "https://your-landing.vercel.app,chrome-extension://<published-id>"
      # Leave unset to allow all origins.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
